# CheckHacks messages (ru). MiniMessage colours, & codes and PlaceholderAPI work. Result words (DETECTED ...) are status codes.
prefix: "<gray>[<aqua>CheckHacks</aqua>]</gray> "
no-permission: "<red>У вас нет прав."
player-not-found: "<red>Игрок <white>%player%</white> не в сети."
usage: "<gray>Использование: <white>/checkhacks <игрок> [моды|категория|all]</white>"
unavailable: "<red>CheckHacks недоступен: <white>%reason%</white>"
disabled: "<red>CheckHacks отключён в checkhacks.yml."
check-started: "<gray>Проверка <white>%player%</white> (<white>%count%</white> модов)..."
cooldown: "<red>%player% недавно проверялся. Подождите <white>%seconds%с</white>."
busy: "<red>%player% уже проверяется."
bedrock-skipped: "<gray>%player% играет на Bedrock: пропущен."
result-header: "<gray>Результат для <white>%player%</white> <dark_gray>|</dark_gray> <gray>%reason% <dark_gray>(запустил %checker%)</dark_gray>"
result-line: "<gray> - <white>%mod%</white><dark_gray>:</dark_gray> %result%"
result-detected: "<red><bold>DETECTED</bold></red>"
result-not-detected: "<green>NOT_DETECTED</green>"
result-protected: "<yellow>PROTECTED</yellow>"
result-skipped: "<gray>SKIPPED</gray>"
result-clean: "<green>%player% выглядит чистым.</green>"
reason-manual: "ручная проверка"
reason-join: "проверка при входе"
reason-anticheat: "сигнал античита"
reason-web: "веб-редактор"
reason-vyxac: "сигнал VyxAC"
alerts-on: "<green>Оповещения CheckHacks включены.</green>"
alerts-off: "<red>Оповещения CheckHacks отключены.</red>"
editor-disabled: "<red>Веб-редактор отключён (web.enabled в checkhacks.yml).</red>"
editor-link: "<gray>Вход в веб-редактор (одноразовый, действует %minutes% мин):</gray> <aqua>%url%</aqua>"
update-available: "<aqua>Доступен VyxAC %version%!</aqua> <white>Нажмите здесь, чтобы скачать.</white>"
update-downloading: "<gray>Загрузка %version%...</gray>"
update-complete: "<green>Загрузка завершена! Перезапустите сервер.</green>"
update-restart-required: "<yellow>Перезапустите сервер, чтобы завершить обновление.</yellow>"
update-failed: "<red>Не удалось обновить: %reason%</red>"
update-no-update: "<green>У вас последняя версия.</green>"
update-disabled: "<red>Обновление отключено (updater.enabled / updater.repo в checkhacks.yml).</red>"
lang-line: "<gray>%player% использует язык клиента <white>%language%</white> <dark_gray>(%code%)</dark_gray>"
list-header: "<gray>Моды, которые может обнаружить проверка:</gray>"
no-history: "<gray>Проверки не найдены.</gray>"
probe-result: "<gray>Проба <white>%key%</white> ответила: <white>%answer%</white> <dark_gray>(%verdict%)</dark_gray>"
reloaded: "<green>Конфигурация CheckHacks перезагружена.</green>"
