# CheckHacks messages (es). MiniMessage colours, & codes and PlaceholderAPI work. Result words (DETECTED ...) are status codes.
prefix: "<gray>[<aqua>CheckHacks</aqua>]</gray> "
no-permission: "<red>No tienes permiso."
player-not-found: "<red>El jugador <white>%player%</white> no esta conectado."
usage: "<gray>Uso: <white>/checkhacks <jugador> [mods|categoria|all]</white>"
unavailable: "<red>CheckHacks no esta disponible: <white>%reason%</white>"
disabled: "<red>CheckHacks esta desactivado en checkhacks.yml."
check-started: "<gray>Comprobando a <white>%player%</white> (<white>%count%</white> mods)..."
cooldown: "<red>%player% fue comprobado hace poco. Espera <white>%seconds%s</white>."
busy: "<red>%player% ya se esta comprobando."
bedrock-skipped: "<gray>%player% es un jugador de Bedrock: omitido."
result-header: "<gray>Resultado de <white>%player%</white> <dark_gray>|</dark_gray> <gray>%reason% <dark_gray>(iniciado por %checker%)</dark_gray>"
result-line: "<gray> - <white>%mod%</white><dark_gray>:</dark_gray> %result%"
result-detected: "<red><bold>DETECTED</bold></red>"
result-not-detected: "<green>NOT_DETECTED</green>"
result-protected: "<yellow>PROTECTED</yellow>"
result-skipped: "<gray>SKIPPED</gray>"
result-clean: "<green>%player% parece limpio.</green>"
reason-manual: "comprobacion manual"
reason-join: "comprobacion al entrar"
reason-anticheat: "alerta del anticheat"
reason-web: "editor web"
reason-vyxac: "alerta de VyxAC"
alerts-on: "<green>Alertas de CheckHacks activadas.</green>"
alerts-off: "<red>Alertas de CheckHacks desactivadas.</red>"
editor-disabled: "<red>El editor web esta desactivado (web.enabled en checkhacks.yml).</red>"
editor-link: "<gray>Acceso al editor web (un solo uso, caduca en %minutes% min):</gray> <aqua>%url%</aqua>"
update-available: "<aqua>VyxAC %version% esta disponible!</aqua> <white>Haz clic aqui para descargar.</white>"
update-downloading: "<gray>Descargando %version%...</gray>"
update-complete: "<green>Descarga completada! Reinicia el servidor.</green>"
update-restart-required: "<yellow>Reinicia el servidor para terminar la actualizacion.</yellow>"
update-failed: "<red>La actualizacion fallo: %reason%</red>"
update-no-update: "<green>Tienes la ultima version.</green>"
update-disabled: "<red>El actualizador esta desactivado (updater.enabled / updater.repo en checkhacks.yml).</red>"
lang-line: "<gray>%player% usa el idioma de cliente <white>%language%</white> <dark_gray>(%code%)</dark_gray>"
list-header: "<gray>Mods que la comprobacion puede detectar:</gray>"
no-history: "<gray>No se encontraron escaneos.</gray>"
probe-result: "<gray>La sonda <white>%key%</white> respondio: <white>%answer%</white> <dark_gray>(%verdict%)</dark_gray>"
reloaded: "<green>Configuracion de CheckHacks recargada.</green>"
